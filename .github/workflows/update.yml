name: Mettre à jour les données de fraude

on:
  schedule:
    - cron: '0 0 * * *' # Exécuté quotidiennement à minuit
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Exécuter le script de mise à jour
        run: python scripts/update_repo.py
      - name: Valider les changements
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/*
          git commit -m "Mise à jour des données de fraude" || echo "Aucun changement à valider"
          git push